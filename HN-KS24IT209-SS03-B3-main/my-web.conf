server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình bảo mật thư mục quản trị nội bộ bằng HTTP Basic Authentication
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    # Cấu hình trang lỗi tùy chỉnh 404
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    access_log /var/log/nginx/my-web.access.log;
    error_log /var/log/nginx/my-web.error.log;
}
